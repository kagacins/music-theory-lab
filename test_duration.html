<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
    <script>
        console.log("Testing Tone.js duration conversion:");
        console.log("4n (quarter note) ->", Tone.Time('4n').toSeconds(), "seconds");
        console.log("2n (half note) ->", Tone.Time('2n').toSeconds(), "seconds");
        console.log("1n (whole note) ->", Tone.Time('1n').toSeconds(), "seconds");
    </script>
</body>
</html>
