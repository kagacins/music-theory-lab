# Netlify Configuration File

[build]
  # Build command to bundle the application
  command = "npm run build"
  # Publish the built output directory
  publish = "dist"

[functions]
  # Node.js version for serverless functions
  node_bundler = "esbuild"

[[redirects]]
  # Redirect all requests to index.html for SPA routing (if needed)
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

