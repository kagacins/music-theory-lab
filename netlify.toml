# Netlify Configuration File

[build]
  # Build command to bundle the application
  command = "npm run build"
  # Publish the built output directory
  publish = "dist"

[dev]
  # Explicitly set the dev command to avoid framework detection issues
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = true
  framework = "vite"

[build.environment]
  # Increase Node heap size to prevent out-of-memory during Vite build
  NODE_OPTIONS = "--max_old_space_size=4096"
  # Allow Supabase anon key in build output (it's designed to be public, protected by RLS)
  # and Google Search keys which are only used server-side in Netlify Functions
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL,GOOGLE_SEARCH_API_KEY,GOOGLE_SEARCH_ENGINE_ID"

[functions]
  # Directory containing Netlify Functions
  directory = "netlify/functions"
  # Node.js version for serverless functions
  node_bundler = "esbuild"

# Headers for static assets - prevent CDN caching issues
[[headers]]
  for = "/key_signatures/*"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    X-Content-Type-Options = "nosniff"

# API routes - redirect to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  # SPA routing fallback - only if file doesn't exist (force = false)
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

